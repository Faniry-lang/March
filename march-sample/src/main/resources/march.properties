march.agents.path=src/main/resources/march-agents/
# Framework defaults - preferred source of runtime properties for March framework
# Token budget (per-session default)
march.token.budget=4000
# History directory (base). AgentId will be appended. Must be writable.
march.history.dir=src/main/resources/march-history/
# Enable embeddings-based tool selection by default (true/false)
march.useEmbeddings=true
# Embedding tokenizer and ONNX resource path (classpath resource)
march.embedding.tokenizer=sentence-transformers/all-MiniLM-L6-v2
march.embedding.modelResource=models/all-MiniLM-L6-v2.onnx
# Tool selection and LLM defaults
march.tool.topn=6
march.max.llm.retries=3
march.cache.ttl.ms=300000
# Provider default
march.provider=openrouter
# Network/backoff defaults (used by Llm clients that read these if needed)
march.connectTimeoutSec=15
march.readTimeoutSec=60
march.writeTimeoutSec=60
march.callTimeoutSec=120
march.llm.initialBackoffMs=500
